# ============================================================
#  pg-baseera Alertmanager Routing Config
#
#  Slack integration: set SLACK_WEBHOOK_URL in .env and
#  uncomment the slack_configs block below to activate.
# ============================================================

global:
  resolve_timeout: 5m

# Routing
route:
  group_by: ['alertname', 'severity']
  group_wait: 30s        # delay before first notification
  group_interval: 5m     # min time between grouped notifications
  repeat_interval: 15m   # re-send if alert still firing
  receiver: 'default'

  routes:
    # Critical alerts — shorter repeat interval
    - matchers:
        - severity = critical
      receiver: 'critical-receiver'
      repeat_interval: 5m

    # Info alerts — longer repeat, less noise
    - matchers:
        - severity = info
      receiver: 'info-receiver'
      repeat_interval: 60m

# Inhibition rules
# critical suppresses warning and info for same alert
# warning suppresses info for same alert
inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity =~ "warning|info"
    equal: ['alertname']

  - source_matchers:
      - severity = warning
    target_matchers:
      - severity = info
    equal: ['alertname']

# Receivers
receivers:

# ============================================================
#  pg-baseera: RDS PostgreSQL Grafana Dashboard ConfigMap
#
#  The kube-prometheus-stack Grafana sidecar watches for
#  ConfigMaps with label grafana_dashboard: "1" and loads
#  them automatically. No manual import needed.
#
#  Apply with:
#    kubectl apply -f grafana-dashboard-cm.yaml -n default
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-rds-postgresql-dashboard
  namespace: default
  labels:
    grafana_dashboard: "1"
    app: kube-prometheus-stack
    release: kube-prometheus-stack
data:
  rds-postgresql.json: |
    {
      "title": "RDS PostgreSQL — Staging",
      "uid": "rds-staging-k8s-01",
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "tags": ["rds", "postgresql", "staging"],
      "panels": [
        {
          "id": 1, "type": "row",
          "title": "CloudWatch — CPU & Load",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "id": 2, "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "type": "timeseries", "title": "CPU Utilization %",
          "datasource": "CloudWatch",
          "targets": [
            {
              "alias": "Primary CPU",
              "dimensions": { "DBInstanceIdentifier": "staging-rds-pg" },
              "metricName": "CPUUtilization",
              "namespace": "AWS/RDS",
              "period": "300",
              "refId": "A",
              "region": "eu-central-1",
              "statistic": "Average"
            },
            {
              "alias": "Replica CPU",
              "dimensions": { "DBInstanceIdentifier": "staging-rds-pg-replica" },
              "metricName": "CPUUtilization",
              "namespace": "AWS/RDS",
              "period": "300",
              "refId": "B",
              "region": "eu-central-1",
              "statistic": "Average"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "percent",
            "thresholds": { "steps": [
              { "color": "green", "value": null },
              { "color": "yellow", "value": 80 },
              { "color": "red", "value": 95 }
            ]}}}
        },
        {
          "id": 3, "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "type": "timeseries", "title": "DB Load (AAS)",
          "datasource": "CloudWatch",
          "targets": [
            {
              "alias": "DB Load",
              "dimensions": { "DBInstanceIdentifier": "staging-rds-pg" },
              "metricName": "DBLoad",
              "namespace": "AWS/RDS",
              "period": "300",
              "refId": "A",
              "region": "eu-central-1",
              "statistic": "Average"
            },
            {
              "alias": "DB Load CPU",
              "dimensions": { "DBInstanceIdentifier": "staging-rds-pg" },
              "metricName": "DBLoadCPU",
              "namespace": "AWS/RDS",
              "period": "300",
              "refId": "B",
              "region": "eu-central-1",
              "statistic": "Average"
            }
          ],
          "fieldConfig": { "defaults": { "thresholds": { "steps": [
            { "color": "green", "value": null },
            { "color": "yellow", "value": 4 },
            { "color": "red", "value": 8 }
          ]}}}
        },
        {
          "id": 4, "type": "row",
          "title": "CloudWatch — Memory & Storage",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 }
        },
        {
          "id": 5, "gridPos": { "h": 8, "w": 12, "x": 0, "y": 10 },
          "type": "timeseries", "title": "Freeable Memory",
          "datasource": "CloudWatch",
          "targets": [
            {
              "alias": "Primary Memory",
              "dimensions": { "DBInstanceIdentifier": "staging-rds-pg" },
              "metricName": "FreeableMemory",
              "namespace": "AWS/RDS",
              "period": "300",
              "refId": "A",
              "region": "eu-central-1",
              "statistic": "Average"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes",
            "thresholds": { "steps": [
              { "color": "red", "value": null },
              { "color": "yellow", "value": 2147483648 },
              { "color": "green", "value": 4294967296 }
            ]}}}
        },
        {
          "id": 6, "gridPos": { "h": 8, "w": 12, "x": 12, "y": 10 },
          "type": "timeseries", "title": "Free Storage Space",
          "datasource": "CloudWatch",
          "targets": [
            {
              "alias": "Free Storage",
              "dimensions": { "DBInstanceIdentifier": "staging-rds-pg" },
              "metricName": "FreeStorageSpace",
              "namespace": "AWS/RDS",
              "period": "300",
              "refId": "A",
              "region": "eu-central-1",
              "statistic": "Average"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes",
            "thresholds": { "steps": [
              { "color": "red", "value": null },
              { "color": "yellow", "value": 21474836480 },
              { "color": "green", "value": 53687091200 }
            ]}}}
        },
        {
          "id": 7, "type": "row",
          "title": "CloudWatch — IO & Connections",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 18 }
        },
        {
          "id": 8, "gridPos": { "h": 8, "w": 12, "x": 0, "y": 19 },
          "type": "timeseries", "title": "Read / Write Latency",
          "datasource": "CloudWatch",
          "targets": [
            {
              "alias": "Read Latency",
              "dimensions": { "DBInstanceIdentifier": "staging-rds-pg" },
              "metricName": "ReadLatency",
              "namespace": "AWS/RDS",
              "period": "300",
              "refId": "A",
              "region": "eu-central-1",
              "statistic": "Average"
            },
            {
              "alias": "Write Latency",
              "dimensions": { "DBInstanceIdentifier": "staging-rds-pg" },
              "metricName": "WriteLatency",
              "namespace": "AWS/RDS",
              "period": "300",
              "refId": "B",
              "region": "eu-central-1",
              "statistic": "Average"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" }}
        },
        {
          "id": 9, "gridPos": { "h": 8, "w": 12, "x": 12, "y": 19 },
          "type": "timeseries", "title": "Database Connections",
          "datasource": "CloudWatch",
          "targets": [
            {
              "alias": "Primary Connections",
              "dimensions": { "DBInstanceIdentifier": "staging-rds-pg" },
              "metricName": "DatabaseConnections",
              "namespace": "AWS/RDS",
              "period": "300",
              "refId": "A",
              "region": "eu-central-1",
              "statistic": "Sum"
            },
            {
              "alias": "Replica Connections",
              "dimensions": { "DBInstanceIdentifier": "staging-rds-pg-replica" },
              "metricName": "DatabaseConnections",
              "namespace": "AWS/RDS",
              "period": "300",
              "refId": "B",
              "region": "eu-central-1",
              "statistic": "Sum"
            }
          ],
          "fieldConfig": { "defaults": { "thresholds": { "steps": [
            { "color": "green", "value": null },
            { "color": "yellow", "value": 4000 }
          ]}}}
        },
        {
          "id": 10, "type": "row",
          "title": "CloudWatch — Replication",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 27 }
        },
        {
          "id": 11, "gridPos": { "h": 8, "w": 12, "x": 0, "y": 28 },
          "type": "timeseries", "title": "Replica Lag (seconds)",
          "datasource": "CloudWatch",
          "targets": [
            {
              "alias": "Replica Lag",
              "dimensions": { "DBInstanceIdentifier": "staging-rds-pg-replica" },
              "metricName": "ReplicaLag",
              "namespace": "AWS/RDS",
              "period": "300",
              "refId": "A",
              "region": "eu-central-1",
              "statistic": "Average"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s",
            "thresholds": { "steps": [
              { "color": "green", "value": null },
              { "color": "yellow", "value": 10 },
              { "color": "red", "value": 30 }
            ]}}}
        },
        {
          "id": 12, "type": "row",
          "title": "Prometheus — PostgreSQL Internals",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 36 }
        },
        {
          "id": 13, "gridPos": { "h": 8, "w": 12, "x": 0, "y": 37 },
          "type": "timeseries", "title": "TPS — Commits & Rollbacks",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "rate(pg_stat_database_xact_commit{datname=\"main\"}[1m])",
              "legendFormat": "Commits/s"
            },
            {
              "expr": "rate(pg_stat_database_xact_rollback{datname=\"main\"}[1m])",
              "legendFormat": "Rollbacks/s"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ops" }}
        },
        {
          "id": 14, "gridPos": { "h": 8, "w": 12, "x": 12, "y": 37 },
          "type": "timeseries", "title": "Dead Tuples — Top Tables",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "topk(5, pg_table_bloat_n_dead_tup)",
              "legendFormat": "{{tablename}}"
            }
          ]
        },
        {
          "id": 15, "gridPos": { "h": 8, "w": 24, "x": 0, "y": 45 },
          "type": "table", "title": "Top 20 Slowest Queries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "topk(20, pg_stat_statements_top_mean_ms)",
              "legendFormat": "{{query}}",
              "instant": true
            }
          ],
          "transformations": [{ "id": "labelsToFields", "options": {} }],
          "fieldConfig": { "defaults": { "unit": "ms" }}
        }
      ]
    }

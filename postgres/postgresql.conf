# Connection
listen_addresses = '*'
max_connections = 100

# Logging — tuned for pgBadger parsing
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 0
log_truncate_on_rotation = on

log_min_duration_statement = 100   # Log queries taking > 100ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 250

# pgBadger requires this exact format
log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '
log_statement = 'none'             # pgBadger uses duration, not all statements

# Performance stats (for postgres_exporter)
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000
track_activity_query_size = 2048
track_counts = on
track_io_timing = on
